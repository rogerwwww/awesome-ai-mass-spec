name: Publish generated README

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: publish-generated-readme
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate structured catalog
        run: python scripts/validate_catalog.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate README
        run: python scripts/generate_readme.py

      - name: Commit generated README when changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: regenerate README [skip ci]"
          git push
