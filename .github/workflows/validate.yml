name: Validate catalog

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "CONTRIBUTING.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate structured catalog
        run: python scripts/validate_catalog.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Exercise README generation
        run: python scripts/generate_readme.py --output /tmp/awesome-ai-mass-spec-README.md
